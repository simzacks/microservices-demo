apiVersion: v1
kind: ServiceAccount
metadata:
  name: adservice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
  namespace: default
  labels:
    app: adservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adservice
  template:
    metadata:
      labels:
        app: adservice
    spec:
      serviceAccountName: adservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: ghcr.io/simzacks/refresher/adservice:latest
        ports:
          - containerPort: 9555
        env:
          - name: PORT
            value: "9555"
        resources:
          requests:
            cpu: 100m
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        readinessProbe:
          initialDelaySeconds: 5
          grpc:
            port: 9555
        livenessProbe:
          initialDelaySeconds: 5
          grpc:
            port: 9555
          
